# 서버 중립 배포 — SERVER_HOST/SERVER_SSH_KEY 시크릿만 맞추면 EC2·Oracle 어디든 동일 동작
# (campus_hanjang_server 와 동일 구조)
name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Copy jar to server
        # @master는 리포 탈취 시 SSH 키 유출로 이어진다 — 버전 태그로 핀 고정
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "build/libs/*-SNAPSHOT.jar"
          target: "/home/ubuntu/app/"
          strip_components: 2

      - name: Restart and health check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            # plain jar(의존성 없음)는 제외하고 실행 가능한 fat jar만 app.jar로 교체
            rm -f /home/ubuntu/app/*-plain.jar
            mv /home/ubuntu/app/*-SNAPSHOT.jar /home/ubuntu/app/app.jar
            sudo systemctl restart mappyenglish

            # 헬스체크 — 90초 내 pong 안 오면 배포 실패 처리
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/api/ping | grep -q 'pong'; then
                echo "Health check passed"
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed - recent logs:"
            sudo journalctl -u mappyenglish -n 50 --no-pager
            exit 1
