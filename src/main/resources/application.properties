spring.application.name=MappyEnglish

# 비밀 값은 환경변수 또는 gitignore 된 application-secret.properties 에서 주입
spring.config.import=optional:classpath:application-secret.properties

# PostgreSQL (로컬 기본값, 운영은 환경변수로 덮어씀)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mappy}
spring.datasource.username=${DATABASE_USERNAME:bsjworld}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret.key=${JWT_SECRET_KEY}

# OpenAI (Whisper STT / GPT-4o-mini 채점 / TTS)
openai.api-key=${OPENAI_API_KEY}

# Kakao OAuth
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}

# Firebase Storage
# service-account-key: 서비스 계정 JSON 을 base64 한 줄로. 비어 있으면 classpath:firebase-key.json 사용(로컬)
firebase.service-account-key=${FIREBASE_SERVICE_ACCOUNT_KEY:}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:mappyproject-5ee09.firebasestorage.app}
