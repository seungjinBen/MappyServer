spring.application.name=MappyEnglish

# 비밀 값은 환경변수 또는 gitignore 된 application-secret.properties 에서 주입
spring.config.import=optional:classpath:application-secret.properties

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mappy
spring.datasource.username=bsjworld
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret.key=${JWT_SECRET_KEY}

# OpenAI (Whisper STT / GPT-4o-mini 채점 / TTS)
openai.api-key=${OPENAI_API_KEY}

# Kakao OAuth
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.redirect-uri=http://localhost:3000/auth/kakao/callback
